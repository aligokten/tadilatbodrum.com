<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<base href="/saha/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Değerlendirme — TadilatBodrum.com</title>
<meta name="description" content="TadilatBodrum.com ile çalışma deneyiminizi değerlendirin.">
<meta property="og:title" content="Görüşünüz bizim için değerli — TadilatBodrum.com">
<meta property="og:description" content="Tadilatınızı 1 dakikada değerlendirin.">
<meta property="og:image" content="https://kesif.tadilatbodrum.com/saha/assets/icon-512.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{ --cyan:#13C4D8; --orange:#FE6B02; --ink:#0B0B0C; --muted:#5B6067; --line:#E7E9EB; --bg:#F4F5F6; --star:#F7A21B;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;min-height:100dvh}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .wrap{max-width:560px;margin:0 auto;padding:calc(16px + var(--safe-t)) 16px calc(28px + var(--safe-b))}
  .card{background:#fff;border-radius:28px;padding:24px 20px;box-shadow:0 1px 2px rgba(11,11,12,.04),0 10px 30px rgba(11,11,12,.06)}
  .logo{display:block;height:44px;margin:4px auto 18px}
  h1{font-family:'Inter Tight',Inter,sans-serif;font-weight:800;font-size:clamp(28px,8vw,38px);letter-spacing:-.03em;line-height:1.04}
  h1 em{font-style:normal;background:linear-gradient(90deg,#13C4D8,#A9C29A 40%,#F7943A 62%,#FE6B02);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{margin:12px 0 4px;color:var(--muted);font-size:15.5px;line-height:1.5;border-left:4px solid var(--cyan);padding-left:12px}
  .q{padding:18px 0;border-bottom:1px solid var(--line)}
  .q:last-of-type{border-bottom:0}
  .q > b{display:block;font-size:16px;margin-bottom:10px}
  .q.main > b{font-size:18px}
  .stars{display:flex;gap:6px}
  .stars button{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--bg);transition:transform .12s}
  .stars button:active{transform:scale(.92)}
  .stars svg{width:30px;height:30px;fill:#D5D8DC}
  .stars button.on svg{fill:var(--star)}
  .q.main .stars button{width:56px;height:56px}.q.main .stars svg{width:36px;height:36px}
  .nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
  .nps button{height:44px;border-radius:10px;background:var(--bg);font-weight:700;font-size:15px}
  .nps button.on{background:var(--ink);color:#fff}
  .nps-l{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
  textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px;resize:vertical;outline:none}
  textarea:focus{border-color:var(--cyan)}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--muted);line-height:1.4}
  .chk input{width:22px;height:22px;accent-color:var(--cyan);flex:none;margin-top:1px}
  .send{width:100%;height:56px;border-radius:18px;background:var(--orange);color:#fff;font-weight:800;font-size:17px;margin-top:18px;box-shadow:0 10px 24px rgba(254,107,2,.3)}
  .send:disabled{opacity:.55}
  .err{color:#C9461A;font-size:14px;margin-top:10px;text-align:center;min-height:20px}
  .done{text-align:center;padding:20px 4px}
  .done .ok{width:84px;height:84px;border-radius:50%;background:#22C55E;display:grid;place-items:center;margin:4px auto 18px;box-shadow:0 12px 30px rgba(34,197,94,.35)}
  .done .ok svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .done p{color:var(--muted);margin-top:10px;line-height:1.5}
  .gbtn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:13px 20px;border-radius:16px;background:var(--bg);font-weight:700;text-decoration:none;color:var(--ink)}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:sp .8s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px}
  .foot a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app"><img class="logo" src="assets/logo.png" alt="TadilatBodrum.com"><div class="spin"></div></div>
  <p class="foot">TadilatBodrum.com · <a href="https://tadilatbodrum.com" target="_blank" rel="noopener">tadilatbodrum.com</a></p>
</div>
<script type="module" src="js/degerlendir.js"></script>
</body>
</html>
